<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Gemini 챗봇</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="theme-color" content="#4f7cff" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>Gemini 챗봇</h1>
      <button id="settingsBtn" title="API 키 설정">⚙️</button>
    </header>

    <div id="settingsPanel" class="settings-panel hidden">
      <label for="apiKeyInput">Gemini API 키</label>
      <input type="password" id="apiKeyInput" placeholder="AIza..." />

      <label for="modelSelect">모델</label>
      <select id="modelSelect">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (빠르고 균형잡힘)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (가장 성능 좋음)</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash-Lite (가장 빠르고 저렴)</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      </select>

      <button id="saveKeyBtn">저장</button>
      <p class="hint">키는 이 브라우저의 로컬 저장소에만 저장되며 서버로 전송되지 않습니다.</p>
    </div>

    <main id="chatWindow" class="chat-window"></main>

    <form id="chatForm" class="chat-form">
      <textarea id="userInput" placeholder="메시지를 입력하세요..." rows="1" required></textarea>
      <button type="submit" id="sendBtn">보내기</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
